name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repo-url:
        description: The apt repository to build the image from
        default: https://blueberrypieos.com/apt/

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Host packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dpkg fakeroot mtools dosfstools fdisk hfsprogs sqv xz-utils python3 zfsutils-linux

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pie-makefs
        run: |
          sudo install -m 644 keys/blueberry-pie-os-archive-keyring.gpg /usr/share/keyrings/
          echo 'deb [signed-by=/usr/share/keyrings/blueberry-pie-os-archive-keyring.gpg] https://blueberrypieos.com/apt/ resolute main' |
            sudo tee /etc/apt/sources.list.d/pie.list > /dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pie-makefs

      - name: Image
        env:
          REPO_URL: ${{ inputs.repo-url || 'https://blueberrypieos.com/apt/' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="0+${GITHUB_SHA::7}"; fi
          ./build.sh -r "$REPO_URL" -o dist "$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: dist/
          if-no-files-found: error

  attest:
    needs: image
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: dist/

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  release:
    needs: attest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: dist/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*
